name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev xvfb
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test workspace (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test --workspace
      - name: Test workspace
        if: runner.os != 'Linux'
        run: cargo test --workspace

  browser:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser fixture formatting
        run: cargo fmt --manifest-path crates/widgets/tests/browser/Cargo.toml --check
      - name: Install browser test tools
        run: |
          cargo install wasm-pack --version 0.13.1 --locked
          npm ci --prefix crates/widgets/tests/browser
          cd crates/widgets/tests/browser
          npx playwright install --with-deps chromium
      - name: Build browser bridge fixture
        run: wasm-pack build crates/widgets/tests/browser --target web --dev --out-dir pkg --out-name bridges
      - name: Test browser bridges
        run: npm test --prefix crates/widgets/tests/browser
      - name: Check browser examples
        run: cargo check -p showcase -p pickers -p creamui-showcase-web --target wasm32-unknown-unknown
