[package]
name = "creamui-theme-loader"
description = "System theme discovery and appearance loading for CreamUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = ["portal"]
portal = ["creamui-appearance/portal"]

[dependencies]
creamui-appearance = { workspace = true, default-features = false }
creamui-theme = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
delib = { version = "0.1.0", path = "../../../delib" }
