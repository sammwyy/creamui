[package]
name = "creamui-router"
description = "Declarative reactive routing for CreamUI, with browser and memory history"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
creamui-core.workspace = true
creamui-reactive.workspace = true
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "History", "Location", "Event", "EventTarget"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
jni = "0.22"
log = "0.4"
