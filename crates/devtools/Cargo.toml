[package]
name = "creamui-devtools"
description = "Development tools for CreamUI applications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "development", "debugging"]
categories = ["gui", "development-tools::debugging"]

[features]
# Adds an engine-counters panel (reconcile/layout/paint/GPU work) to the F3
# overlay, fed by creamui-core's/creamui-render's own perf-metrics counters.
# Off by default like the crates it forwards.
perf-metrics = ["creamui-core/perf-metrics", "creamui-render/perf-metrics"]

[dependencies]
creamui-core = { workspace = true }
creamui-render = { workspace = true }
creamui-theme = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "1"
