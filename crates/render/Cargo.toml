[package]
name = "creamui-render"
description = "Rendering backend for CreamUI"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "rendering", "wgpu"]
categories = ["gui"]

[features]
default = ["platform-winit"]
platform-winit = ["creamui-platform/winit-adapter"]
platform-wayland = ["creamui-platform/wayland"]
platform-blur-kwin = ["creamui-platform/blur-kwin"]
platform-blur-blair = ["creamui-platform/blur-blair"]
platform-x11 = ["creamui-platform/x11"]
platform-windows = ["creamui-platform/windows"]
# Native Linux system-tray integration through the freedesktop
# StatusNotifierItem D-Bus protocol. It is opt-in and does not use GTK.
tray = ["dep:creamui-tray", "creamui-tray/linux-status-notifier"]
# See `creamui-core`'s `perf-metrics` feature; this forwards it and adds
# counters/spans for the render-specific stages (display items, text
# layouts, CPU raster, GPU upload, draw calls).
perf-metrics = ["creamui-core/perf-metrics", "dep:tracing"]
system-theme = ["dep:creamui-theme-loader"]
# Installs `env_logger` so `RUST_LOG` and `CUI_DEBUG=1` print engine logs.
logger = ["dep:env_logger"]

[dependencies]
creamui-core = { workspace = true }
creamui-theme = { workspace = true }
creamui-theme-loader = { workspace = true, optional = true }
creamui-fonts = { workspace = true }
creamui-reactive = { workspace = true }
creamui-tray = { workspace = true, optional = true }
creamui-platform = { workspace = true }
tiny-skia = { workspace = true }
swash = "0.2"
rustc-hash = "2"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = { version = "0.11", default-features = false, optional = true }
tracing = { version = "0.1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
softbuffer = { workspace = true }
raw-window-handle = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = { version = "0.31", features = ["system"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
web-time = "1"

[dev-dependencies]
creamui-widgets = { workspace = true }
