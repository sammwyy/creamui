[package]
name = "creamui-platform"
description = "Window, event, and native-surface abstraction for CreamUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["gui", "windowing", "wayland", "x11"]
categories = ["gui"]

[features]
default = ["winit-adapter", "desktop"]
winit-adapter = ["winit/rwh_06"]
desktop = ["winit/x11", "winit/wayland", "winit/wayland-dlopen", "winit/wayland-csd-adwaita"]
android = ["winit-adapter", "winit/android-native-activity"]
wayland = ["dep:smithay-client-toolkit", "dep:wayland-client", "dep:wayland-protocols-wlr", "dep:xkbcommon"]
x11 = ["winit-adapter", "winit/x11"]
windows = ["winit-adapter"]
# Background blur on Wayland: each backend is an optional, additive
# integration for the compositor that speaks its protocol, so a build that
# only ever runs under one of them doesn't pay for the other's dependency.
# Neither is enabled by `wayland` itself; `set_blur_region` stays a no-op
# without at least one of these on.
blur-kwin = ["wayland", "dep:wayland-protocols-plasma"]
blur-blair = ["wayland", "dep:blair-blur-protocol"]

[dependencies]
raw-window-handle = { workspace = true }
winit = { workspace = true }
smithay-client-toolkit = { version = "0.19", optional = true }
wayland-client = { version = "0.31", features = ["system"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }
blair-blur-protocol = { path = "../../../blair/crates/blur-protocol", features = ["client"], optional = true }
xkbcommon = { version = "0.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "Node",
    "Window",
] }
web-time = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
log = "0.4"
ndk-context = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
