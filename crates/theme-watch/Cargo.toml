[package]
name = "creamui-theme-watch"
description = "Live CreamUI appearance reload notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["theme", "gui", "dbus", "desktop"]
categories = ["gui", "os::linux-apis"]

[features]
default = ["dbus"]
# Public portal notifications and queries; linked only on Linux.
dbus = ["dep:dbus", "creamui-appearance/portal", "creamui-theme-loader/portal"]

[dependencies]
creamui-appearance = { workspace = true, default-features = false }
creamui-theme-loader = { workspace = true, default-features = false }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }
