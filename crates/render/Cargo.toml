[package]
name = "creamui-render"
description = "Rendering backend for CreamUI"
version = "0.1.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "rendering", "wgpu"]
categories = ["gui"]

[features]
default = ["platform-winit"]
platform-winit = ["creamui-platform/winit-adapter"]
platform-wayland = ["creamui-platform/wayland"]
platform-x11 = ["creamui-platform/x11"]
platform-windows = ["creamui-platform/windows"]
# Native Linux system-tray integration through the freedesktop
# StatusNotifierItem D-Bus protocol. It is opt-in and does not use GTK.
tray = ["dep:creamui-tray", "creamui-tray/linux-status-notifier"]

[dependencies]
creamui-core = { workspace = true }
creamui-theme = { workspace = true }
creamui-fonts = { workspace = true }
creamui-reactive = { workspace = true }
creamui-tray = { workspace = true, optional = true }
creamui-platform = { workspace = true }
tiny-skia = { workspace = true }
fontdue = "0.9"
bytemuck = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { workspace = true }
pollster = { workspace = true }
softbuffer = { workspace = true }
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "ImageData"] }
web-time = "1"

[dev-dependencies]
creamui-widgets = { workspace = true }
