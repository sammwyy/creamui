[package]
name = "creamui-image"
description = "Decoded raster-image widget for CreamUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gui", "ui", "image", "webp"]
categories = ["gui", "multimedia::images"]

[features]
default = ["png"]
png = ["image-rs/png"]
jpeg = ["image-rs/jpeg"]
webp = ["image-rs/webp"]
svg = ["dep:resvg", "png"]

[dependencies]
creamui-core = { workspace = true }
creamui-theme = { workspace = true }
image-rs = { package = "image", version = "0.25.10", default-features = false }
resvg = { version = "0.45.1", optional = true }
