[package]
name = "creamui-platform"
description = "Window, event, and native-surface abstraction for CreamUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["gui", "windowing", "wayland", "x11"]
categories = ["gui"]

[features]
default = ["winit-adapter"]
winit-adapter = []
wayland = ["dep:smithay-client-toolkit", "dep:wayland-client", "dep:wayland-protocols-wlr"]
x11 = ["winit-adapter"]
windows = ["winit-adapter"]

[dependencies]
raw-window-handle = { workspace = true }
winit = { workspace = true }
smithay-client-toolkit = { version = "0.19", optional = true }
wayland-client = { version = "0.31", features = ["system"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
