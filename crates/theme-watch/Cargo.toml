[package]
name = "creamui-theme-watch"
description = "Live CreamUI appearance reload notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["theme", "gui", "dbus", "desktop"]
categories = ["gui", "os::linux-apis"]

[features]
default = ["dbus"]
# Session-bus backend. The `dbus` crate is linked only on Linux. Windows,
# Android, and WebAssembly keep the idle backend even when this is enabled.
# Disable it (`default-features = false`) to keep D-Bus out of a Linux build.
dbus = ["dep:dbus"]

[dependencies]
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }
