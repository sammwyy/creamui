[package]
name = "creamui-ffi"
description = "ABI-stable C interface for consuming CreamUI as a shared library"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ffi", "cdylib", "gui", "ui"]
categories = ["api-bindings", "gui"]

[lib]
name = "creamui"
crate-type = ["cdylib", "rlib"]

[features]
default = ["gpu"]
gpu = ["creamui-render/gpu"]

[dependencies]
creamui-core = { workspace = true }
creamui-theme = { workspace = true }
creamui-widgets = { workspace = true }
creamui-render = { version = "0.3.0", path = "../render", default-features = false, features = ["platform-winit"] }
creamui-reactive = { workspace = true }
creamui-abi = { workspace = true }

[dev-dependencies]
libloading = "0.8"

[[test]]
name = "retained_window_smoke"
harness = false
